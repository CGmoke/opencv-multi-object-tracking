# ---------------------------------------------------------------------------
# Multi-object tracking configuration
#
# Every value can be overridden on the command line, e.g.
#   mot-track --config configs/default.yaml --source 0 --tracker kcf
# Unknown keys are rejected on purpose (typos should fail, not be ignored).
# ---------------------------------------------------------------------------
source:
  # Camera index ("0") or path to a video file ("assets/demo.mp4").
  source: "0"
  # Stop after N processed frames; null means "until the stream ends".
  max_frames: null
  # Restart a video file when it ends (ignored for cameras).
  loop: false
  # Initial target boxes as [x, y, w, h]; also available as --seed-box.
  seed_boxes: []

tracking:
  # csrt = accurate/slow, kcf = fast/looser, mil/mosse = experimental.
  backend: csrt
  # Minimum IoU for a detection to keep an existing id and for duplicate
  # suppression. Lower = fewer duplicate ids, higher = fewer id swaps.
  iou_threshold: 0.3
  # Frames a lost target may keep its id before the id is destroyed.
  max_missing: 15
  # Maximum trail points kept per target (trail_length / fps = seconds).
  trail_length: 120
  # greedy (default, dependency free) or hungarian (requires scipy).
  match_method: greedy
  # Hard cap on simultaneously live ids (memory guard).
  max_tracks: 256
  # EMA alpha applied when a detection re-anchors an existing id.
  # 1.0 = use the detection box as-is; smaller = steadier box, slightly laggier.
  box_smoothing: 1.0
  # Track lifecycle: a track is confirmed after this many hits; tentative tracks are
  # not rendered/exported and are destroyed on their very first miss.
  min_hits: 3
  # Moving-average window for boxes (and thus trail centres). <=1 disables it and
  # takes precedence over box_smoothing when > 1.
  smooth_window: 5
  # Track-level sanity check: drop a detection whose width/height differs from the
  # overlapping track's box by more than this ratio (fragment/local box). 1.0 = off.
  max_box_change: 1.6

detector:
  # Optional detector hook; "none" disables it (boxes then come from the mouse
  # or --seed-box). "yolo" is reserved for the detector wiring milestone.
  backend: none
  # Local model path; null means "no model". Weights are never downloaded
  # automatically (see docs/ROADMAP.md on the .pt code-execution risk).
  model: null
  confidence: 0.35
  classes: []
  # Run the detector every N frames; the first frame always runs it.
  interval: 1

motion:
  # Auto-detect moving objects with background modelling — no model weights needed.
  # Enable with `--motion` or set enabled: true. When both detector and motion are
  # configured, the detector wins.
  enabled: false
  # Background subtractor: mog2 (fast, default) or knn (steadier on textured scenes).
  # Both run with detectShadows disabled.
  method: mog2
  # Sensitivity: smaller = more sensitive to small intensity changes.
  # 25 is deliberately above OpenCV's default 16 to suppress texture noise.
  var_threshold: 25.0
  # KNN squared-distance threshold (only used when method: knn); raise to 625 for noise.
  dist2_threshold: 400.0
  # Background learning rate after warm-up. 0.0 freezes the model so a moving object
  # stays fully in the foreground (accurate boxes); raise it if lighting drifts.
  learning_rate: 0.0
  warmup_frames: 20
  warmup_rate: 0.05
  # Minimum target size thresholds (noise/speckle filter).
  min_area_px: 200.0
  min_width_px: 8
  min_height_px: 8
  # Reject foreground covering more than this fraction of the frame (scene-wide change).
  max_area_ratio: 0.6
  # Input denoising before background modelling (grayscale is created first):
  # Gaussian blur kernel (odd, 0 = off). Sensor grain / compression noise would
  # otherwise be amplified into false foreground blobs.
  blur_kernel: 5
  # Median blur kernel (odd, 0 = off). Stronger against salt/pepper and JPEG
  # artifacts; 3 is usually enough.
  median_kernel: 0
  # Temporal consistency: AND the last N foreground masks so single-frame flicker
  # and edge jitter never reach the contour stage. 1 disables it; keep N <= 3,
  # because the intersection trims the box of fast-moving targets.
  temporal_frames: 2
  # Allowed box aspect ratio w/h; rejects extremely thin texture strips.
  min_aspect: 0.1
  max_aspect: 10.0
  # Reject hollow/fragmented contours below this contour/box fill ratio (0 = off).
  min_fill_ratio: 0.0
  # Fragment merging: boxes of the same object (IoU >= merge_iou, or edge gap
  # <= merge_gap_px) become one whole-object box. gap 0 only merges overlapping or
  # touching boxes, so genuinely separate neighbours are never merged.
  merge_iou: 0.15
  merge_gap_px: 0.0
  # NMS: drop overlapping boxes and boxes contained in a larger whole-object box.
  nms_iou: 0.6
  nms_containment: 0.8
  # A candidate must persist this many frames AND move at least min_motion_px.
  min_consecutive: 2
  min_motion_px: 6.0
  # Static-target removal by IoU temporal continuity: consecutive detections whose
  # boxes overlap this much count as "not moving"; after static_frames in a row the
  # target is dropped (catches objects that moved and then stopped).
  static_iou: 0.95
  static_frames: 30
  morph_kernel: 3
  # Run motion detection every N frames; the first frame always runs it.
  interval: 2
  # Real-world size calibration: pixels per metre at the target depth (null = pixels only).
  pixels_per_meter: null
  small_max_m: 0.5
  large_min_m: 2.0

display:
  enabled: true
  show_trails: true
  show_labels: true
  show_hud: true
  trail_fade: true
  window_name: "OpenCV MOT"

output:
  # Per-frame trajectory rows; null disables csv export.
  csv_path: "outputs/trajectories.csv"
  # Optional annotated video (mp4/avi); null disables recording.
  video_path: null
  # Append to an existing csv instead of truncating it (also --append).
  append: false

web:
  # Local web monitoring UI (requires the optional extra: pip install -e ".[web]").
  # Binds to localhost by default; use --web-host 0.0.0.0 to expose on the LAN.
  host: "127.0.0.1"
  port: 8000
  # Maximum number of concurrent tracking sessions (camera / RTSP / upload / browser).
  max_sessions: 4
  # MJPEG stream and browser-frame rate cap.
  stream_fps: 15.0
  # Where uploaded videos are stored; null means a temporary directory.
  upload_dir: null
  # Reject uploads larger than this many bytes.
  max_upload_bytes: 2000000000
