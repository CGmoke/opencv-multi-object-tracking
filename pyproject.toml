[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "opencv-multi-object-tracking"
version = "0.1.0"
description = "Pure-OpenCV multi-object tracking: per-object CSRT/KCF trackers, IoU association, unique IDs, trails and CSV export."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "CGmoke" }]
keywords = [
    "opencv",
    "object-tracking",
    "multi-object-tracking",
    "csrt",
    "kcf",
    "iou",
    "computer-vision",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.21",
    "opencv-contrib-python>=4.5.1",
    "PyYAML>=5.4",
]

[project.optional-dependencies]
hungarian = ["scipy>=1.8"]
detect = ["ultralytics>=8.0"]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
mot-track = "mot.app:main"

[project.urls]
Homepage = "https://github.com/CGmoke/opencv-multi-object-tracking"
Repository = "https://github.com/CGmoke/opencv-multi-object-tracking"
Issues = "https://github.com/CGmoke/opencv-multi-object-tracking/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mot = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "opencv: requires an OpenCV build that ships the tracking module",
    "slow: end-to-end tests that render video frames",
]

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
# Deliberately narrow: the package still supports Python 3.9, so pyupgrade fixes
# such as PEP 604/585 annotations must not be applied to runtime code.
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]  # pytest.importorskip must run before importing mot.*
"scripts/*" = ["T201"]
