name: Feature request
description: 建议新功能或改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请说明要解决的问题，而不只是方案。较大的改动建议先讨论设计。
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 当前哪里不够用？在什么场景下？
      placeholder: 我在……场景需要……
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 可以是 API、配置、CLI 或文档层面的改动
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案 / 已尝试的绕法
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: 相关模块
      options:
        - 跟踪 / ID 管理
        - 匹配算法
        - 输入输出（视频 / 摄像头）
        - 轨迹导出
        - 可视化 / 交互
        - 配置
        - 检测器扩展（YOLO）
        - 文档 / 工程
        - 其他
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 已搜索过现有 Issue 与 ROADMAP
          required: true
