name: Bug report
description: 报告可复现的缺陷
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！请先搜索是否已有相同 Issue。安全问题请勿公开提交，见 SECURITY.md。
  - type: textarea
    id: what-happened
    attributes:
      label: 发生了什么
      description: 实际行为与预期行为的差异
      placeholder: 期望……实际……
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 最小复现步骤
      description: 命令行、配置、以及可复现的输入（不要附真实人员视频）
      placeholder: |
        1. mot-track --source demo.mp4 --seed-box 10,10,50,50 --no-display
        2. ...
      render: shell
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志 / 报错
      description: 末尾关键堆栈或 `--verbose` 日志
      render: shell
    validations:
      required: false
  - type: textarea
    id: config
    attributes:
      label: 相关配置
      description: "输出 `mot-track --dump-config`（可脱敏）"
      render: yaml
    validations:
      required: false
  - type: input
    id: versions
    attributes:
      label: 环境
      description: "输出：python -c \"import sys, cv2, numpy; print(sys.version, cv2.__version__, numpy.__version__)\""
      placeholder: "3.12.3 / 4.6.0 / 1.26.4"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      options:
        - Linux
        - macOS
        - Windows
        - 其他
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 已搜索过现有 Issue
          required: true
        - label: 已尝试最新 main 分支
          required: false
